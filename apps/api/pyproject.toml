[project]
name = "zms-api"
version = "0.1.0"
description = "ZMS SEO Dashboard backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "supabase>=2.9.0",
  "celery[redis]>=5.4.0",
  "redis>=5.2.0",
  "httpx>=0.27.0",
  "tenacity>=9.0.0",
  "python-dotenv>=1.0.0",
  "structlog>=24.4.0",
  "google-api-python-client>=2.150.0",
  "google-auth>=2.35.0",
  "google-auth-oauthlib>=1.2.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "markdown>=3.7.0",
  "python-frontmatter>=1.1.0",
  "reportlab>=4.2.0",
  "pillow>=11.0.0",
  "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.7.0",
  "mypy>=1.13.0",
  "ipython>=8.29.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
